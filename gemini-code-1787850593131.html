<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Minecraft Prototype</title>
    <style>
        body {
            background-color: #222;
            color: white;
            text-align: center;
            font-family: sans-serif;
            margin-top: 50px;
        }
        canvas {
            background-color: #87CEEB; /* Sky blue */
            display: block;
            margin: 0 auto;
            border: 4px solid #fff;
        }
    </style>
</head>
<body>

    <h1>2D Minecraft Sandbox</h1>
    <p>Use <b>A / D</b> to move left and right, and click on blocks to break them!</p>
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Grid and block settings
        const tileSize = 40;
        const cols = canvas.width / tileSize;
        const rows = canvas.height / tileSize;

        // 0 = Air, 1 = Grass, 2 = Dirt, 3 = Stone
        let world = [];
        for (let c = 0; c < cols; c++) {
            world[c] = [];
            for (let r = 0; r < rows; r++) {
                if (r < rows / 2) {
                    world[c][r] = 0; // Air
                } else if (r === Math.floor(rows / 2)) {
                    world[c][r] = 1; // Grass
                } else if (r < rows - 2) {
                    world[c][r] = 2; // Dirt
                } else {
                    world[c][r] = 3; // Stone
                }
            }
        }

        // Player object
        let player = {
            x: 100,
            y: 100,
            width: 30,
            height: 35,
            vx: 0,
            vy: 0,
            speed: 4
        };

        let keys = {};

        // Input listeners
        window.addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);

        canvas.addEventListener("click", (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const gridX = Math.floor(mouseX / tileSize);
            const gridY = Math.floor(mouseY / tileSize);

            if (gridX >= 0 && gridX < cols && gridY >= 0 && gridY < rows) {
                world[gridX][gridY] = 0; // Break block (turn to air)
            }
        });

        // Game loop
        function update() {
            // Movement logic
            player.vx = 0;
            if (keys['a']) player.vx = -player.speed;
            if (keys['d']) player.vx = player.speed;

            player.x += player.vx;

            // Simple gravity
            player.vy += 0.5;
            player.y += player.vy;

            // Simple floor collision
            const groundLevel = canvas.height / tileSize * tileSize - (tileSize * 5);
            if (player.y + player.height > groundLevel) {
                player.y = groundLevel - player.height;
                player.vy = 0;
            }
        }

        function draw() {
            // Clear screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw world blocks
            for (let c = 0; c < cols; c++) {
                for (let r = 0; r < rows; r++) {
                    if (world[c][r] === 1) {
                        ctx.fillStyle = "#55953b"; // Grass green
                        ctx.fillRect(c * tileSize, r * tileSize, tileSize, tileSize);
                    } else if (world[c][r] === 2) {
                        ctx.fillStyle = "#866043"; // Dirt brown
                        ctx.fillRect(c * tileSize, r * tileSize, tileSize, tileSize);
                    } else if (world[c][r] === 3) {
                        ctx.fillStyle = "#7f7f7f"; // Stone gray
                        ctx.fillRect(c * tileSize, r * tileSize, tileSize, tileSize);
                    }
                }
            }

            // Draw player
            ctx.fillStyle = "#ff3333"; // Red player box
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
